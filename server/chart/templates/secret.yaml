{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sgrepo.name" . }}
  labels: {{- include "sgrepo.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY: {{ required "secret.accessKey (or existingSecret) is required" .Values.secret.accessKey | quote }}
  S3_SECRET_KEY: {{ required "secret.secretKey (or existingSecret) is required" .Values.secret.secretKey | quote }}
  ADMIN_TOKEN: {{ .Values.secret.adminToken | quote }}
{{- end }}
