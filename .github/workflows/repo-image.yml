# The image of the adventure repository service (server/) → ghcr.io/<owner>/scrying-glass-repo.
# A push to main that touches the service — tags `main` and the commit; a tag repo-v<version>
# (git tag repo-v0.1.0 && git push origin repo-v0.1.0) — the tag `<version>` the Helm chart uses (appVersion).
name: Repository service image

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/shared/repo.ts', '.github/workflows/repo-image.yml']
    tags: ['repo-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/scrying-glass-repo
          tags: |
            type=ref,event=branch
            type=sha
            type=match,pattern=repo-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
