# Сборка под все системы. По тегу v* (git tag v0.9.0 && git push origin v0.9.0) — черновик релиза со всеми
# файлами: его надо проверить и опубликовать на GitHub. Вручную (Actions → Сборка → Run workflow) — только
# файлы сборки в артефактах запуска, без релиза.
name: Сборка

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Обе сборки macOS (Apple Silicon и Intel) — на одной машине Apple Silicon.
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: rpmbuild для пакета .rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Версия тега совпадает с package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Тег $GITHUB_REF_NAME, а в package.json версия $v"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --draft --title "Scrying Glass ${GITHUB_REF_NAME#v}" --generate-notes
