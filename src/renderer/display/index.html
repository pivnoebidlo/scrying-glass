<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' sg-asset:; style-src 'self' 'unsafe-inline'" />
  <title>Scrying Glass — экран игроков</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    #stage { position: fixed; inset: 0; }
    .layer { position: absolute; inset: 0; }
    #blackout { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .4s ease; z-index: 10; }
    #blackout.on { opacity: 1; }

    /* Портреты */
    .portraits { position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; padding: 2vmin; box-sizing: border-box; }
    .portrait { display: flex; flex-direction: column; flex: 0 0 calc(100% / var(--cols, 1)); height: calc(100% / var(--rows, 1)); padding: 1.5vmin; box-sizing: border-box; opacity: 0; transform: scale(.96); transition: opacity .4s ease, transform .4s ease, flex-basis .3s ease, height .3s ease; }
    .portrait.shown { opacity: 1; transform: none; }
    .portrait .frame { flex: 1; min-height: 0; }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .caption { flex: none; padding-top: 1vmin; text-align: center; color: #fff; font-family: Georgia, serif; font-size: var(--cap, 3vmin); line-height: 1.2; max-height: 2.4em; overflow: hidden; text-shadow: 0 0 .5em #000; }
    .caption[hidden], .no-captions .caption { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="blackout"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
