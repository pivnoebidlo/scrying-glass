<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' sg-asset:; style-src 'self' 'unsafe-inline'" />
  <title>Scrying Glass — управление</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #1b1a24; color: #e8e6f0; }
    h1 { margin: 0 0 20px; font-size: 22px; font-weight: 600; }
    section { background: #26243a; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: #a9a4c9; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, input[type=text], button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #44406a; background: #1b1a24; color: inherit; }
    button { cursor: pointer; background: #5b4bd6; border-color: #5b4bd6; }
    button.secondary { background: transparent; border-color: #44406a; }
    button:hover { filter: brightness(1.1); }
    .hint, #status { font-size: 13px; color: #a9a4c9; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .card { position: relative; background: #1b1a24; border: 2px solid transparent; border-radius: 10px; overflow: hidden; }
    .card.on { border-color: #8f7cff; }
    .thumb { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; cursor: pointer; }
    .card input { width: 100%; box-sizing: border-box; border: 0; border-top: 1px solid #44406a; border-radius: 0; background: transparent; padding: 6px 8px; font-size: 13px; }
    .badge { position: absolute; left: 6px; top: 6px; background: #5b4bd6; color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 999px; }
    [hidden] { display: none !important; }
    .group { margin-bottom: 8px; }
    .group-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; }
    .group-title { flex: 1; font-weight: 600; cursor: pointer; user-select: none; }
    button.small { padding: 4px 10px; font-size: 12px; }
    label.hint { display: inline-flex; align-items: center; gap: 6px; }
    .del { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; padding: 0; line-height: 1; border-radius: 999px; background: rgba(0,0,0,.6); border-color: transparent; }
  </style>
</head>
<body>
  <h1>🔮 Scrying Glass</h1>

  <section>
    <h2>Внешний экран</h2>
    <div class="row">
      <select id="display-select"></select>
      <button id="open-btn">Открыть</button>
      <button id="close-btn" class="secondary">Закрыть</button>
      <button id="blackout-btn" class="secondary">Погасить экран</button>
      <button id="reveal-btn" class="secondary">Папка кампании</button>
      <span id="status"></span>
    </div>
  </section>

  <div id="modules"></div>

  <script src="app.js"></script>
  <script src="../modules/portraits/control.js"></script>
  <script src="boot.js"></script>
</body>
</html>
